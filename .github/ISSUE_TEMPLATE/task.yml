---
name: Task
description: One outcome, done in one session and one PR
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done, and why. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: >-
        At most 5 outcomes you can see, in plain words. No commands or output.
      placeholder: |
        - [ ] Password login over SSH is refused on both hosts
        - [ ] A second `site.yml` run reports `changed=0`
    validations:
      required: true
