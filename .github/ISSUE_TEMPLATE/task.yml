---
name: Task
description: One piece of work, small enough for one session and one PR
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: >-
        Checks that prove it works, e.g. a command and its expected output.
      placeholder: |
        - [ ] `ssh -o PubkeyAuthentication=no nuc-rhel` prints `Permission denied (publickey)`
        - [ ] The `lint` check passes on the PR
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, open questions, out of scope.
